name: Examples

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "examples/**"
      - "docs/**"
      - "bin/scripts/examples-smoke.sh"
      - "bin/scripts/check-doc-links.sh"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build and smoke examples
        run: make examples-smoke

      - name: Validate local documentation links
        run: make docs-link-check
