apiVersion: apps/v1
kind: Deployment
metadata:
  name: gosky
  namespace: default
  labels:
    app.kubernetes.io/name: gosky
    app.kubernetes.io/managed-by: gofly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gosky
  template:
    metadata:
      labels:
        app: gosky
        app.kubernetes.io/name: gosky
    spec:
      containers:
        - name: gosky
          image: gosky:latest
          ports:
            - name: http
              containerPort: 8080
            - name: rpc
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gosky
  namespace: default
  labels:
    app.kubernetes.io/name: gosky
spec:
  selector:
    app: gosky
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: rpc
      port: 8081
      targetPort: rpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gosky-config
  namespace: default
data:
  app.json: |
    {}
---
apiVersion: v1
kind: Secret
metadata:
  name: gosky-secret
  namespace: default
type: Opaque
stringData:
  admin-token: change-me-admin-token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gosky
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gosky
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gosky
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: gosky
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gosky
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gosky
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

