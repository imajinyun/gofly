apiVersion: v1
kind: ConfigMap
metadata:
  name: gosky-otel-collector
  namespace: default
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
      resource:
        attributes:
          - key: service.name
            value: gosky
            action: upsert
    exporters:
      logging:
        verbosity: basic
      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [logging, otlp]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [logging]
